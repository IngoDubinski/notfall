<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.json"><title>Notfall</title><style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#eee;font:16px system-ui;line-height:1.55}main,header,footer{max-width:720px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292929}h1,h2,h3,p{margin:0 0 12px}h1{font-size:26px;letter-spacing:-1px}small,.muted{color:#aaa}button,input,textarea,select{font:inherit;color:inherit;background:#111;border:1px solid #444;border-radius:10px;padding:12px}button{cursor:pointer}button:hover{border-color:#aaa}a{color:#9ddbb6}input:not([type=checkbox]),textarea{width:100%;margin:5px 0 12px}textarea{min-height:100px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{text-align:left;min-height:108px;display:flex;flex-direction:column;justify-content:center;gap:4px}.tile b{font-size:17px}.tile span{font-size:24px;color:#9ddbb6}.tile small{font-size:12px}.danger{border-color:#a54d4d;color:#ff9c9c}.panel,details{border:1px solid #333;border-radius:12px;padding:16px;margin:10px 0}summary{cursor:pointer;font-weight:650}label{display:block;margin:8px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.pill{font-size:12px;color:#9ddbb6}.big{font-size:36px;font-weight:700}.warning{color:#ffbd83}footer{font-size:12px;color:#888;border-top:1px solid #222}.check{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #222}.check input{width:20px;height:20px;accent-color:#8dcba6}.pulse{width:76px;height:76px;border-radius:50%;background:#263d30;margin:20px auto}.pulse.on{background:#9ddbb6}svg{max-width:240px;display:block;margin:15px auto}li{margin:7px 0}button:focus-visible,a:focus-visible{outline:2px solid #9ddbb6}.tile:first-child span{color:#ff9292}@media(max-width:360px){main{padding:12px}.tile{padding:9px}}
</style><header><div><h1>Notfall<span style="color:#9ddbb6">.</span></h1><small>Vorsorge · Wissen · Selbsthilfe</small></div><button onclick="go('home')" aria-label="Startseite">⌂</button></header><main id="app"></main><footer>Web-Prototyp v0.1 · 26.11.2026 · Keine echten persönlichen Daten eingeben. Kein medizinisch freigegebenes Produkt.</footer><script src="content.js"></script><script>
const $=s=>document.querySelector(s),app=$('#app'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state;try{state=JSON.parse(localStorage.getItem('notfall-demo-v1'))||{}}catch{state={}};state.items??=[];state.check??={};state.notes??='';state.plan??={};state.cash??='';state.people??=4;state.days??=10;let timer,audio,headingHandler;const save=()=>localStorage.setItem('notfall-demo-v1',JSON.stringify(state));const tiles=[['aid','✚','Erste Hilfe','Sofortmaßnahmen & Taktgeber'],['sos','☎','Notruf & Notsignal','112 · 110 · 116117'],['survival','◇','Survival','Wissen für Krisen'],['prep','☑','Krisenvorsorge','BBK · Checklisten'],['stock','▤','Vorräte','Bestand & MHD'],['calc','∑','Vorratsrechner','Bedarf & Einkaufsliste'],['bag','▣','Notgepäck','Packliste'],['compass','⊕','Kompass','Magnetische Orientierung'],['plan','◎','Familien-Notfallplan','Treffpunkte & Kontakte'],['notes','≡','Notizen','Adressen & Informationen'],['docs','▧','Dokumente','PDF-Vorschau'],['cash','€','Bargeld','Reserve erfassen'],['settings','⚙','Einstellungen','Sicherheit & Backup']];
function stop(){clearInterval(timer);timer=null;if(audio){audio.close().catch(()=>{});audio=null}if(headingHandler){window.removeEventListener('deviceorientationabsolute',headingHandler);window.removeEventListener('deviceorientation',headingHandler);headingHandler=null}}
function title(t){return '<button onclick="go(\'home\')">‹ Startseite</button><h2 style="margin-top:18px">'+t+'</h2>'}function articles(type){return CONTENT.filter(x=>x.type===type).map(article).join('')}function article(x){return '<details><summary>'+esc(x.title)+'</summary><ul>'+x.points.map(p=>'<li>'+esc(p)+'</li>').join('')+'</ul><small>Quelle: <a href="'+x.url+'" target="_blank" rel="noopener">'+esc(x.source)+'</a> · Stand 26.11.2026</small></details>'}function checks(key,arr){return arr.map((x,i)=>'<label class="check"><input type="checkbox" '+(state.check[key+i]?'checked':'')+' onchange="state.check[\''+key+i+'\']=this.checked;save()">'+esc(x)+'</label>').join('')}
function due(){let today=new Date();let d=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');return state.items.filter(x=>x.date&&x.date<=d)}
function go(page){stop();window.scrollTo(0,0);let html='';switch(page){case 'home':html='<p class="pill">● Lokaler Testmodus · keine Cloud</p><input aria-label="Globale Suche" placeholder="Wissen, Notizen, Vorräte suchen …" oninput="search(this.value)"><div id="results"></div><div class="panel '+(due().length?'warning':'')+'"><b>MHD-Übersicht</b><p>'+due().length+' fällige Einträge</p><button onclick="go(\'stock\')">Vorräte öffnen</button></div><div class="grid">'+tiles.map(([id,icon,name,desc])=>'<button class="tile" onclick="go(\''+id+'\')"><span>'+icon+'</span><b>'+name+'</b><small>'+desc+'</small></button>').join('')+'</div>';break;
case 'aid':html=title('Erste Hilfe')+'<p class="warning">Bei lebensbedrohlichen Notfällen 112 wählen. Anweisungen der Leitstelle befolgen.</p><div class="panel"><h3>Herzdruckmassage · Erwachsene</h3><svg viewBox="0 0 180 140" role="img" aria-label="Schematische Darstellung der Brustmitte"><path d="M60 16 Q90 35 120 16 L150 45 136 125 H44 L30 45Z" fill="none" stroke="#aaa" stroke-width="3"/><path d="M90 35V115" stroke="#555" stroke-dasharray="4 4"/><circle cx="90" cy="78" r="16" fill="#a54d4d"/><path d="M90 48V67m-7-7 7 7 7-7" stroke="#fff" fill="none" stroke-width="3"/></svg><small>Schema: Druckpunkt in der Mitte des Brustkorbs, untere Brustbeinhälfte.</small><div class="pulse" id="pulse"></div><p class="big" style="text-align:center">110 BPM</p><div class="row"><button onclick="sound(\'beat\')">Takt starten</button><button onclick="stop()">Stopp</button></div></div>'+articles('aid');break;
case 'sos':html=title('Notruf & Notsignal')+'<div class="panel"><p><a href="tel:112">112 – Rettungsdienst / Feuerwehr</a></p><p><a href="tel:110">110 – Polizei</a></p><p><a href="tel:116117">116117 – Ärztlicher Bereitschaftsdienst</a></p><small>Telefonverbindung erforderlich. Keine automatische Alarmierung.</small></div><div class="panel"><h3>Akustisches Notsignal</h3><p>Ton über den Lautsprecher; keine Kontaktaufnahme mit Rettungsdiensten.</p><div class="row"><button class="danger" onclick="sound(\'sos\')">Signal starten</button><button onclick="stop()">Stopp</button></div></div>';break;
case 'survival':html=title('Survival-Wissen')+articles('survival');break;
case 'prep':html=title('Krisenvorsorge')+articles('prep')+'<div class="panel">'+checks('prep',['Trinkwasser','Haltbare Lebensmittel','Hausapotheke','Radio mit Batterien','Licht & Ersatzbatterien','Hygieneartikel','Bargeld','Dokumentenkopien','Notgepäck','Familienplan'])+'</div>';break;
case 'bag':html=title('Notgepäck')+'<p>Auswahl nach BBK, individuell ergänzen.</p><div class="panel">'+checks('bag',['Persönliche Medikamente','Erste-Hilfe-Material','Trinkwasser und Proviant','Wetterfeste Kleidung','Decke oder Schlafsack','Taschenlampe und Batterien','Radio','Hygieneartikel','Dokumentenmappe','Ausweis, Schlüssel, Handy, Bargeld'])+'</div><a href="'+CONTENT.find(x=>x.title==='Notgepäck').url+'">BBK: Notgepäck</a>';break;
case 'stock':html=title('Vorräte')+'<div class="panel"><h3>Eintrag hinzufügen</h3><form onsubmit="addStock(event)"><label>Artikel<input name="name" required placeholder="z. B. Wasser"></label><div class="row"><label>Menge<input name="qty" type="number" min="0.01" step="any" required></label><label>Einheit<select name="unit"><option>Stück</option><option>Liter</option><option>kg</option></select></label></div><label>Lagerort<input name="loc"></label><label>MHD<input name="date" type="date"></label><button>Speichern</button></form></div>'+state.items.map((x,i)=>'<div class="panel"><b>'+esc(x.name)+' · '+esc(x.qty)+' '+esc(x.unit)+'</b><p class="'+(due().includes(x)?'warning':'')+'">'+esc(x.loc)+' · MHD: '+esc(x.date||'–')+(due().includes(x)?' · erreicht':'')+'</p><button onclick="state.items.splice('+i+',1);save();go(\'stock\')">Entfernen</button></div>').join('')+'<p class="muted">MHD wird beim Öffnen geprüft. Hintergrund-Push erst in Android; MHD ist kein Verbrauchsdatum.</p>';break;
case 'calc':html=title('Vorratsrechner')+'<label>Personen<input type="number" min="1" max="100" value="'+state.people+'" onchange="state.people=Math.max(1,Math.min(100,Number(this.value)||1));save();go(\'calc\')"></label><label>Tage<input type="number" min="1" max="365" value="'+state.days+'" onchange="state.days=Math.max(1,Math.min(365,Number(this.value)||1));save();go(\'calc\')"></label><div class="panel"><small>Getränke & Kochen, Richtwert 2 Liter pro Person/Tag</small><p class="big">'+state.people*state.days*2+' Liter</p><p>BBK: möglichst 10 Tage, mindestens 3 Tage als Einstieg.</p></div><div class="panel"><h3>Einkaufsliste</h3><p>Wasser fehlt: '+Math.max(0,state.people*state.days*2-state.items.filter(x=>x.unit==='Liter'&&/wasser/i.test(x.name)&&!due().includes(x)).reduce((a,x)=>a+Number(x.qty),0))+' Liter</p><small>Automatischer Abgleich zunächst nur für Wasser; weitere Lebensmittel folgen.</small></div>';break;
case 'notes':html=title('Notizen')+'<label>Testnotizen<textarea oninput="state.notes=this.value;save()">'+esc(state.notes)+'</textarea></label>';break;
case 'plan':html=title('Familien-Notfallplan')+['Treffpunkt nahe Zuhause','Alternativer Treffpunkt','Ansprechpartner','Aufgaben','Besondere Bedürfnisse'].map((x,i)=>'<label>'+x+'<textarea oninput="state.plan['+i+']=this.value;save()">'+esc(state.plan[i]||'')+'</textarea></label>').join('');break;
case 'cash':html=title('Bargeld')+'<div class="panel"><small>Test-Bargeldreserve</small><p class="big">'+Number(state.cash||0).toLocaleString('de-DE',{style:'currency',currency:'EUR'})+'</p><label>Betrag in Euro<input type="number" min="0" step="0.01" value="'+esc(state.cash)+'" onchange="state.cash=Math.max(0,Number(this.value)||0);save();go(\'cash\')"></label></div><p class="warning">Demo ohne Verschlüsselung. Keine echten Beträge eingeben.</p>';break;
case 'docs':html=title('Offline-Dokumente')+'<p>PDF lokal öffnen (nur Vorschau, keine dauerhafte Ablage in v0.1).</p><input type="file" accept="application/pdf" onchange="if(this.files[0]){let u=URL.createObjectURL(this.files[0]);document.getElementById(\'pdf\').src=u}"><iframe id="pdf" title="PDF Vorschau" style="width:100%;height:420px;border:1px solid #333"></iframe>';break;
case 'compass':html=title('Kompass')+'<div class="panel" style="text-align:center"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="87" stroke="#555" fill="none"/><g fill="#ddd" text-anchor="middle"><text x="100" y="30">N</text><text x="173" y="105">O</text><text x="100" y="180">S</text><text x="26" y="105">W</text></g><g id="needle"><path d="M100 42L86 100H114Z" fill="#ff8c8c"/><path d="M100 158L86 100H114Z" fill="#999"/></g></svg><p class="big" id="heading">– °</p><p id="sensor">Kein Sensorwert verfügbar. Grafik ist nur eine Vorschau.</p><button onclick="compass()">Sensor aktivieren</button></div>';break;
case 'settings':html=title('Einstellungen')+'<div class="panel"><h3>AMOLED-Schwarz</h3><p>Standarddesign aktiv.</p><h3>Passwort / Fingerabdruck</h3><p>Für native Android-Version vorgesehen; aktuell kein Schutz.</p><h3>Supabase</h3><p>Optionales Backup geplant; keine Verbindung eingerichtet.</p><button onclick="if(confirm(\'Alle lokalen Testdaten löschen?\')){localStorage.removeItem(\'notfall-demo-v1\');location.reload()}">Testdaten löschen</button></div>';break;}app.innerHTML=html;}
function addStock(e){e.preventDefault();state.items.push(Object.fromEntries(new FormData(e.target)));save();go('stock')}function search(q){q=q.trim().toLowerCase();$('#results').innerHTML=q?CONTENT.filter(x=>(x.title+' '+x.points.join(' ')).toLowerCase().includes(q)).map(article).join('')+(state.notes.toLowerCase().includes(q)?'<button onclick="go(\'notes\')">Notizen</button>':'')+state.items.filter(x=>x.name.toLowerCase().includes(q)).map(x=>'<button onclick="go(\'stock\')">'+esc(x.name)+'</button>').join(''):''}
function sound(mode){stop();let C=window.AudioContext||window.webkitAudioContext;if(!C){alert('Audio nicht verfügbar');return}audio=new C();audio.resume();let tick=()=>{if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=mode==='beat'?750:900;g.gain.value=.12;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+(mode==='beat'?.07:.25));let p=$('#pulse');if(p){p.classList.add('on');setTimeout(()=>p.classList.remove('on'),100)}};tick();timer=setInterval(tick,mode==='beat'?60000/110:700)}
async function compass(){stop();try{if(typeof DeviceOrientationEvent==='undefined'){return}if(typeof DeviceOrientationEvent.requestPermission==='function'&&await DeviceOrientationEvent.requestPermission()!=='granted')return;headingHandler=e=>{let h=e.webkitCompassHeading??(e.absolute&&e.alpha!==null?(360-e.alpha)%360:null);if(h===null||!Number.isFinite(h)||!$('#heading'))return;$('#heading').textContent=Math.round(h)+'°';$('#needle').setAttribute('transform','rotate('+(-h)+' 100 100)');$('#sensor').textContent='Sensorwert · Genauigkeit nicht geprüft'};window.addEventListener('deviceorientationabsolute',headingHandler);window.addEventListener('deviceorientation',headingHandler)}catch(e){$('#sensor').textContent='Sensor nicht verfügbar'}}go('home');if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
